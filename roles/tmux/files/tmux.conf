set -g default-terminal "tmux-256color"
# Install the tmux-256color terminfo entry on remote hosts before starting tmux.
# Add remote terminal types here only when their terminfo is available there.
set -as terminal-features ",alacritty:RGB,xterm-256color:RGB,screen-256color:RGB"
set -s extended-keys on

setw -g mode-keys vi
set -g mouse on

set -g focus-events on

bind-key -T copy-mode-vi 'v' send -X begin-selection

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

bind S choose-tree
bind O last-window
bind r command-prompt -I '#W' -p 'Window name:' 'rename-window "%%"'
bind R source-file ~/.tmux.conf \; display-message "Reloaded tmux config"

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Zellij-like floating terminal panes (tmux popups). They start in the focused
# pane's directory and disappear when their shell exits.
bind f display-popup -E -w 90% -h 80% -d "#{pane_current_path}" -T 'Floating pane'
bind F display-popup -E -w 50% -h 45% -d "#{pane_current_path}" -T 'Floating pane'

bind C-l switch-client -l

# Alt 1-9 select window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-C copy-mode

set -s escape-time 10

# tmux-yank
set -g @shell_mode 'vi'

# tmux plugins
set -g @plugin 'tmux-plugins/tpm#e261deb1b47614eed3400089ce7197dc68acc4eb'
set -g @plugin 'tmux-plugins/tmux-sensible#25cb91f42d020f675bb0a2ce3fbd3a5d96119efa'
set -g @plugin 'tmux-plugins/tmux-yank#acfd36e4fcba99f8310a7dfb432111c242fe7392'
set -g @plugin 'tmux-plugins/tmux-open#763d0a852e6703ce0f5090a508330012a7e6788e'
set -g @plugin 'tmux-plugins/tmux-resurrect#cff343cf9e81983d3da0c8562b01616f12e8d548'
set -g @plugin 'wfxr/tmux-power#d69c4d7ffc64828ac5ac4b3056dacdd7ef51997f'

# tmux-resurrect
set -g @resurrect-strategy-vim      'session'

# Powerline-style community theme.
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_status_interval 1
set -g @tmux_power_left_c '⌘ #{pane_current_command}'
set -g @tmux_power_right_x '#(~/.tmux/scripts/vpn-status)'


run '~/.tmux/plugins/tpm/tpm'
