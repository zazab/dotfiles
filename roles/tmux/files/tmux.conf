set -g default-terminal "tmux-256color"
# Install the tmux-256color terminfo entry on remote hosts before starting tmux.
# Add remote terminal types here only when their terminfo is available there.
set -as terminal-features ",alacritty:RGB,xterm-256color:RGB,xterm-ghostty:RGB,screen-256color:RGB"
set -s extended-keys on

setw -g mode-keys vi
set -g mouse on

set -g focus-events on

bind-key -T copy-mode-vi 'v' send -X begin-selection

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

bind S choose-tree
bind O last-window
bind r command-prompt -I '#W' -p 'Window name:' 'rename-window "%%"'
bind , command-prompt -I '#{pane_title}' -p 'Pane name:' 'select-pane -T "%%"'
bind z run-shell "~/.tmux/scripts/toggle-pane-titles"
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_index}: #{pane_title} '
bind R source-file ~/.tmux.conf \; display-message "Reloaded tmux config"

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Zellij-like floating terminal pane (tmux popup). It starts in the focused
# pane's directory and disappears when its shell exits.
bind f display-popup -E -w 90% -h 80% -d "#{pane_current_path}" -T 'Floating pane'
# Session managers: a full controller and a focused lazy-restoration browser.
unbind m
bind m display-popup -E -w 95% -h 90% -T 'tmux control' ~/.local/share/tmux-popup-control/tmux-popup-control
bind g display-popup -E -w 95% -h 90% -T 'tmux sessions' ~/.local/share/tmux-popup-control/tmux-popup-control --root-menu session:tree

bind C-l switch-client -l

# Alt 1-9 select window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Ghostty maps Cmd+Option+1..9 to User0..User8; Cmd+Option+0 maps to User9.
# The private sequences keep these distinct from Option+number window selection.
set -s user-keys[0] "\e[57361~"
set -s user-keys[1] "\e[57362~"
set -s user-keys[2] "\e[57363~"
set -s user-keys[3] "\e[57364~"
set -s user-keys[4] "\e[57365~"
set -s user-keys[5] "\e[57366~"
set -s user-keys[6] "\e[57367~"
set -s user-keys[7] "\e[57368~"
set -s user-keys[8] "\e[57369~"
set -s user-keys[9] "\e[57370~"
bind -n User0 select-pane -t 1
bind -n User1 select-pane -t 2
bind -n User2 select-pane -t 3
bind -n User3 select-pane -t 4
bind -n User4 select-pane -t 5
bind -n User5 select-pane -t 6
bind -n User6 select-pane -t 7
bind -n User7 select-pane -t 8
bind -n User8 select-pane -t 9
bind -n User9 select-pane -t 10

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-C copy-mode

set -s escape-time 10

# tmux-yank
set -g @shell_mode 'vi'

# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'wfxr/tmux-power'

# Powerline-style community theme.
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_status_interval 1
set -g @tmux_power_left_c '⌘ #{pane_current_command}'
set -g @tmux_power_right_x '#(~/.tmux/scripts/vpn-status)'

# TPM is the sole plugin loader.
run "~/.tmux/plugins/tpm/tpm"

# Keep tiled panes distinct without dimming their terminal contents.
set -g pane-border-style "fg=#6c7086,bg=default"
set -g pane-active-border-style "fg=#a7c080,bg=default,bold"
