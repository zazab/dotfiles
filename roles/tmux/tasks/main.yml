---
- name: Set up tmux configuration
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ ansible_facts['user_dir'] }}/.tmux.conf"
    mode: '0644'
  notify: Install tmux plugins

- name: Create tmux plugin directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .tmux
    - .tmux/plugins
    - .tmux/scripts

- name: Install tmux status scripts
  ansible.builtin.copy:
    src: vpn-status
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/scripts/vpn-status"
    mode: '0755'

- name: Install pinned TPM
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm"
    version: e261deb1b47614eed3400089ce7197dc68acc4eb
  notify: Install tmux plugins

...
