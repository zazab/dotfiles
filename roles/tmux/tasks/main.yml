---
- name: Set up tmux configuration
  ansible.builtin.copy:
    src: tmux.conf
    dest: "{{ ansible_facts['user_dir'] }}/.tmux.conf"
    mode: '0644'
  notify: Install tmux plugins

- name: Create tmux plugin directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - .tmux
    - .tmux/plugins
    - .tmux/scripts

- name: Install tmux status scripts
  ansible.builtin.copy:
    src: vpn-status
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/scripts/vpn-status"
    mode: '0755'

- name: Install tmux pane title toggle script
  ansible.builtin.copy:
    src: toggle-pane-titles
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/scripts/toggle-pane-titles"
    mode: '0755'

- name: Install TPM
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm"
  notify: Install tmux plugins

- name: Install tmux-popup-control source
  ansible.builtin.git:
    repo: https://github.com/atomicstack/tmux-popup-control
    dest: "{{ ansible_facts['user_dir'] }}/.local/share/tmux-popup-control"
  register: tmux_popup_control_checkout

- name: Vendor tmux-popup-control Go dependencies
  ansible.builtin.command:
    cmd: go mod vendor
    chdir: "{{ ansible_facts['user_dir'] }}/.local/share/tmux-popup-control"
  when: tmux_popup_control_checkout.changed

- name: Build tmux-popup-control
  ansible.builtin.command:
    cmd: make build
    chdir: "{{ ansible_facts['user_dir'] }}/.local/share/tmux-popup-control"
  when: tmux_popup_control_checkout.changed

- name: Prune unmanaged tmux plugins
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/.tmux/plugins/tpm/bin/clean_plugins"
  changed_when: false

...
